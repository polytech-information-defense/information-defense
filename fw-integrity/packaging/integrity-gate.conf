# Drop-in для fw-filter.service и fw-web.service:
#   /etc/systemd/system/fw-filter.service.d/integrity-gate.conf
#   /etc/systemd/system/fw-web.service.d/integrity-gate.conf
# Служба не запустится, если в текущей загрузке не было успешной проверки
# целостности или ПО МЭ в аварийном режиме (ЦЛС-07).
[Unit]
Wants=fw-integrity.service
After=fw-integrity.service

[Service]
# "+" -- команда выполняется от root (файл состояния доступен только root),
# даже если сама служба работает от непривилегированного пользователя.
ExecStartPre=+/usr/bin/env PYTHONPATH=/usr/lib/fw PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m fw_integrity gate
