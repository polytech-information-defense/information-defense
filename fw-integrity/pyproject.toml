[project]
name = "fw-integrity"
version = "0.1.0"
description = "ПО МЭ: подсистема контроля целостности"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
fw-integrity = "fw_integrity.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fw_integrity"]

[tool.ruff]
line-length = 120
target-version = "py313"
